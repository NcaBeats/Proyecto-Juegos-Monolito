spring:
  application:
    name: ${APP_NAME:myapp}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${DB_NAME:mydatabase}
    username: ${DB_USER:myuser}
    password: ${DB_PASSWORD:secret}

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  data:
    rest:
      basePath: /api/v1

server:
  port: 8080