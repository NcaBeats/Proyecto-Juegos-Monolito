spring:
  application:
    name: ${APP_NAME:myapp}

  datasource:
    driver-class-name: org.postgresql.Driver
    # Default local solo para que el perfil test pueda enlazar estas
    # propiedades: los tests usan Testcontainers con @ServiceConnection, que
    # construye el datasource desde el contenedor e ignora estos valores.
    # Los perfiles dev y prod los sobrescriben SIN default, para que un entorno
    # mal configurado falle al arrancar en vez de apuntar a un localhost.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/proyecto_juegos}
    username: ${SPRING_DATASOURCE_USERNAME:nico}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 500MB

  jackson:
    find-and-add-modules: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}

  media:
    normalize:
      # Runner de una pasada que reescribe a URL absoluta las filas que todavia
      # guardan la ruta legacy /uploads/games/{slug}/trailer.mp4. Es idempotente.
      # Prendelo una vez (APP_MEDIA_NORMALIZE_ENABLED=true), revisá la linea de
      # log "MediaUrlNormalizer: found=... rewritten=...", y apagalo.
      enabled: ${APP_MEDIA_NORMALIZE_ENABLED:false}

  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}"

  security:
    login:
      # 5 fallos por correo y 20 por IP dentro de una ventana de 15 minutos.
      max-per-email: 5
      max-per-ip: 20
      window-ms: 900000

  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:trailers}
    public-base-url: ${R2_PUBLIC_BASE_URL:https://pub-58f3bb038ab8451e96fb292f7cb1dc15.r2.dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: ${PORT:9090}