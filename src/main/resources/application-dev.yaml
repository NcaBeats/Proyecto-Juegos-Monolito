spring:
  application:
    name: proyecto_juegos_monolito
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: true

app:
  seed:
    enabled: true
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:3600000}
  cloudinary:
    url: ${CLOUDINARY_URL}

logging:
  level:
    com.app.proyectojuegosmonolito: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,mappings,loggers
