services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: '${CONTAINER_NAME:-postgres-container}'
    environment:
      - 'POSTGRES_DB=${DB_NAME:-mydatabase}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-secret}'
      - 'POSTGRES_USER=${DB_USER:-myuser}'
    ports:
      - '5432:5432'
