services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: '${CONTAINER_NAME:-postgres-container}'
    environment:
      - 'POSTGRES_DB=${DB_NAME:-proyecto_juegos}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:?falta DB_PASSWORD en .env}'
      - 'POSTGRES_USER=${DB_USER:-nico}'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'

  app:
    build: .
    container_name: 'juegos-app'
    env_file:
      - .env
    ports:
      - '9090:8080'
    depends_on:
      - postgres
    environment:
      - 'PORT=8080'
      - 'SPRING_PROFILES_ACTIVE=dev'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-proyecto_juegos}'

volumes:
  postgres-data:
